<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>O'FAME LEGACY - Sign In</title>
  <meta property="og:title" content="Sign in — O'FAME Farm Feed & Foodstuffs" />
  <meta property="og:description" content="Sign in to manage your orders and account." />
  <meta property="og:image" content="/images/UQGQ6407.JPG" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="page">
    <header class="site-header">
      <div class="header-brand">
        <a href="/">
          <img class="site-logo" src="/images/UQGQ6407.JPG" alt="O'FAME Farm Feed logo" />
        </a>
        <div>
          <h1>O'FAME Farm Feed & Foodstuffs</h1>
          <p class="site-tagline">Farm feed, foodstuffs, and livestock in one trusted marketplace.</p>
        </div>
      </div>
      <nav>
        <a href="/">Menu</a>
        <a href="/cart">Cart ({{ cart_count|default(0) }})</a>
      </nav>
    </header>

    <section class="checkout reveal-on-scroll">
      <h2 style="margin-bottom:8px;">Create your account</h2>
      <p style="color:#475d48;margin-bottom:24px;">Fill in your details to sign in or register automatically.</p>
      <form method="POST" action="/login">
        <div class="form-group">
          <label for="first_name">First Name</label>
          <input id="first_name" type="text" name="first_name" required placeholder="Your first name" />
        </div>
        <div class="form-group">
          <label for="last_name">Last Name</label>
          <input id="last_name" type="text" name="last_name" required placeholder="Your last name" />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" name="email" required placeholder="your@gmail.com" />
        </div>
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input id="phone" type="tel" name="phone" placeholder="+234 800 000 0000" />
        </div>
        <div class="form-group">
          <label for="address">Delivery Address</label>
          <input id="address" type="text" name="address" placeholder="Street, City, State" />
        </div>
        <button type="submit"><i class="fas fa-user-plus"></i> Create Account &amp; Sign In</button>
      </form>
    </section>
  </div>
  <script src="/static/scroll.js"></script>
</body>
</html>
